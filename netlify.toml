[build]
  command = "node scripts/prerender.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/desk"
  to = "/.netlify/functions/desk"
  status = 200
  force = true

# Free LLC Name Check (static page in /llc-name-check/). Listed before the SPA catch-all.
# Per-state pages later: add /llc-name-check/<slug>/index.html; Netlify serves existing files first.
[[redirects]]
  from = "/llc-name-check"
  to = "/llc-name-check/index.html"
  status = 200

[[redirects]]
  from = "/llc-name-check/"
  to = "/llc-name-check/index.html"
  status = 200

[[redirects]]
  from = "/fees"
  to = "/llc-fees"
  status = 301

# SPA routes only. Static pages (/form, /privacy, /terms, /contact, /llc-fees, /learn, robots.txt, sitemap.xml)
# are real files and win over these rules. Anything else gets 404.html with a real 404 status.
[[redirects]]
  from = "/form/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/app"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The runtime config may change outside a deploy (llc-config branch), so the bundled copy is not cached long.
[[headers]]
  for = "/llc-name-check/llc-states.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/llc-name-check/llc-need-rules.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
