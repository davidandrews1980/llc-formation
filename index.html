<style>
:root{
  --paper:#f3efe6;--paper-2:#e8e1d2;--cream:#fbf8f1;--ink:#161b1e;--ink-soft:#2a3238;
  --pine:#2c4a3e;--pine-2:#3d6354;--mist:#6b6560;--line:#d5ccbc;--danger:#8f2d2d;
  --shadow:0 0 0 1px rgba(22,27,30,.06),0 1px 2px -1px rgba(22,27,30,.06),0 2px 4px rgba(22,27,30,.04);
}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.55;min-height:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.02em;line-height:1.15;font-weight:500;margin:0}
a{color:inherit}button,select,input,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-family:Fraunces,serif;font-size:1.15rem}
.mark{width:1.6rem;height:1.6rem;border-radius:999px;background:var(--pine);color:var(--paper);display:grid;place-items:center;font-size:.7rem;font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.nav a,.ghost, .btn, .chip{display:inline-flex;align-items:center;justify-content:center;border:0;text-decoration:none}
.nav a{padding:.4rem .7rem;color:var(--mist);font-size:.875rem}
.nav a:hover,.nav a.on{color:var(--ink)}
.btn{height:2.75rem;padding:0 1.15rem;border-radius:.5rem;background:var(--ink);color:var(--paper);font-weight:500}
.btn:hover{background:#000}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.paper{background:var(--paper);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.pine{background:var(--pine)}
.hero{background:var(--ink);color:var(--paper);padding:4rem 0}
.hero p.k{letter-spacing:.18em;text-transform:uppercase;font-size:.7rem;color:rgba(251,248,241,.55);margin:0}
.hero h1{font-size:clamp(2.1rem,6vw,3.6rem);margin-top:1rem;max-width:18ch}
.hero .lede{margin-top:1.4rem;max-width:36rem;color:rgba(251,248,241,.75);font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.8rem}
.card{background:var(--cream);border-radius:.75rem;box-shadow:var(--shadow);padding:1.25rem}
.ink-card{background:var(--ink-soft);border-radius:.9rem;padding:1.4rem;color:var(--paper)}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kicker{letter-spacing:.18em;text-transform:uppercase;font-size:.7rem;color:var(--mist);margin:0}
.mist{color:var(--mist)}.small{font-size:.875rem}.tiny{font-size:.75rem}
section.pad{padding:3.5rem 0}
.price{font-variant-numeric:tabular-nums}
.steps{display:flex;flex-wrap:wrap;gap:.4rem;margin:1.4rem 0 0;list-style:none;padding:0}
.steps button{border:0;border-radius:999px;padding:.3rem .7rem;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;background:var(--paper-2);color:var(--mist)}
.steps button.on{background:var(--ink);color:var(--paper)}.steps button.done{background:rgba(44,74,62,.15);color:var(--pine)}
.field{display:flex;flex-direction:column;gap:.35rem;font-size:.875rem}
.field span{color:var(--mist);font-size:.75rem;letter-spacing:.04em;text-transform:uppercase}
input,select,textarea{height:2.75rem;min-height:44px;border:0;border-radius:.45rem;background:var(--paper);box-shadow:var(--shadow);padding:0 .75rem;color:var(--ink)}
textarea{height:auto;min-height:6rem;padding:.75rem;resize:vertical}
.banner{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:.5rem;padding:.85rem 1rem;margin-bottom:1.4rem}
.filing{background:var(--ink);color:var(--paper);border-radius:.6rem;padding:1.2rem 1.15rem;margin-top:1.4rem}
.filing h3{font-size:2rem}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1.1rem;font-size:.875rem}
.dl div span{display:block;color:rgba(251,248,241,.5);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.quick{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.chip{height:2.6rem;padding:0 .85rem;border-radius:.5rem;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);font-size:.875rem}
.chip.on{background:var(--ink);color:var(--paper)}
.lock{height:2.7rem;border-radius:.45rem;background:var(--paper-2);display:flex;align-items:center;justify-content:space-between;padding:0 .75rem;font-size:.875rem}
.foot{border-top:1px solid var(--line);background:var(--cream);padding:2.5rem 0;margin-top:3rem;font-size:.875rem;color:var(--mist)}
.sticky{position:sticky;bottom:0;background:rgba(243,239,230,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:.8rem 0;margin-top:1.5rem}
.warn{color:var(--danger)}
.ok{color:var(--pine)}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th,td{text-align:left;padding:.65rem .4rem;border-bottom:1px solid var(--line)}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);font-weight:500}
.badge{display:inline-block;border-radius:999px;padding:.15rem .55rem;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;background:var(--paper-2)}
.badge.due,.badge.awaiting_payment{background:#f3e2c7;color:#8a5a1a}.badge.paid{background:#dce8e1;color:var(--pine)}.badge.filed{background:var(--ink);color:var(--paper)}
.pf-consent{position:fixed;left:.75rem;bottom:.75rem;z-index:50;max-width:24rem;display:flex;align-items:center;flex-wrap:wrap;gap:.5rem .75rem;background:var(--ink);color:var(--paper);border-radius:.5rem;padding:.6rem .8rem;font-size:.8rem;line-height:1.4;box-shadow:0 4px 16px rgba(22,27,30,.25)}
.pf-consent p{margin:0;flex:1 1 12rem}
.pf-consent button{height:2rem;padding:0 .8rem;border-radius:.4rem;border:0;font-size:.8rem;font-weight:500;background:var(--paper);color:var(--ink)}
.pf-consent button.pf-no{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1px rgba(251,248,241,.35)}
.pf-consent[hidden]{display:none}
.wiz-cols{grid-template-columns:minmax(0,1.6fr) minmax(16rem,.8fr);gap:2rem}
@media (max-width:600px){.wiz-cols{grid-template-columns:minmax(0,1fr)}

  .nav a,.brand,.foot a{min-height:44px;display:inline-flex;align-items:center}
  .top{flex-direction:column;align-items:stretch;gap:0;padding:.4rem 1rem}
  .nav{flex-wrap:nowrap;overflow-x:auto;gap:0;margin:0 -.4rem;scrollbar-width:none}
  .nav a{white-space:nowrap;padding:.4rem .55rem}
  main[data-wizard-step]{padding-top:1rem!important}
  .wiz-cols > div > h1{font-size:1.7rem}
  .steps{flex-wrap:nowrap;overflow-x:auto;margin-top:.9rem;scrollbar-width:none}
  .steps button{min-height:44px;white-space:nowrap}
  .field input,.field select{min-height:44px}
  [data-act="back-state"]{min-height:44px;padding:0 .2rem!important}
  body{padding-bottom:5.5rem}
  .pf-consent{padding:.4rem .5rem;gap:.4rem;font-size:.72rem;line-height:1.3;flex-wrap:nowrap}
  .pf-consent p{flex:1 1 auto}
  .pf-consent button{height:2.75rem;min-width:44px;padding:0 .6rem;flex:none}}
@media (max-width:30rem){.pf-consent{left:.5rem;right:.5rem;bottom:.5rem;max-width:none}}
@media(max-width:720px){.dl{grid-template-columns:1fr}.hero{padding:2.5rem 0}h1{font-size:2rem!important}
</style>
</head>

  const set = (sel, attr, val) => { const el = document.head.querySelector(sel); if (el) el.setAttribute(attr, val); };
  set('meta[name="description"]', "content", m[1]);
  set('meta[property="og:title"]', "content", m[0]);
  set('meta[name="twitter:title"]', "content", m[0]);
  set('meta[property="og:description"]', "content", m[1]);
  set('meta[name="robots"]', "content", priv ? "noindex,nofollow" : noindex ? "noindex,follow" : "index,follow");
  set('meta[name="twitter:description"]', "content", m[1]);
  const canon = SITE + (META[path] ? (path === "/" ? "/" : path) : "/");
  set('link[rel="canonical"]', "href", canon);
  set('meta[property="og:url"]', "content", canon);
}

function setStateFields(code) {
  const prev = draft.stateCode;
  draft.stateCode = code;
  draft.principal.state = code;
  draft.mailing.state = code;
  draft.ra.state = code;
  draft.members = draft.members.map(m => ({...m, state: (!m.state || m.state === prev) ? code : m.state}));
}
function applyState(code) {
  if (!BY[code]) return;
  setStateFields(code);
  persist();
  const r = route();
  if (r.path === "/form") {
    const qs = new URLSearchParams(r.q);
    qs.set("state", code);
    history.replaceState(null, "", "/form?" + qs.toString());
  }
  render();
}

// Applied once: the name and state go into the draft, the wizard opens on the Name step, and the
// name is dropped from the URL so later edits are not overwritten.
function cleanHandoffName(s) {
  return String(s || "").replace(/[<>\u2122\u00ae\u00a9]/g, " ")
    .replace(/[\u2190-\u2bff\u2600-\u27bf\ufe0f\u200d]|[\ud800-\udbff][\udc00-\udfff]/g, " ")
    .replace(/\s+/g, " ").trim().slice(0, 200);
}
function draftInProgress() {
  return !!(draft.llcName.trim() || draft.principal.street || draft.ra.name || draft.members.some(m => m.name && m.name.trim()));
}
function applyNameHandoff(q) {
  if (typeof q.name !== "string" || !q.name.trim()) return false;
  const incoming = cleanHandoffName(q.name);
  // A filing already in progress is kept unless the person agrees to start over with the new name.
  if (draftInProgress() && draft.llcName.trim() !== incoming) {
    const keep = !window.confirm(`You have a filing in progress${draft.llcName.trim() ? ` for "${draft.llcName.trim()}"` : ""}. Start a new one for "${incoming}" instead? Choose Cancel to keep your current filing.`);
    if (keep) { history.replaceState(null, "", location.pathname + location.search + "#/form"); return true; }
    const fresh = blank(); Object.keys(draft).forEach(k => delete draft[k]); Object.assign(draft, fresh);
  }
  if (q.state && BY[q.state]) setStateFields(q.state);
  draft.llcName = incoming;
  draft.step = 1;
  persist();
  history.replaceState(null, "", location.pathname + location.search + "#/form?state=" + draft.stateCode);
  return true;
}

  return header(false)+`<main class="wrap pad"><p class="kicker">50 states</p><h1 style="font-size:2rem">What the state charges</h1>
    <p class="small mist">Pass-through at cost.</p>
    <div style="overflow:auto;margin-top:1.4rem"><table><thead><tr><th>State</th><th>Fee</th><th>Document</th><th>Agency</th><th>Processing</th><th></th></tr></thead><tbody>
    ${STATES.map(s=>`<tr><td>${s.name}</td><td class="price">${money(s.feeCents)}</td><td>${esc(s.document)}</td><td>${esc(s.agency)}</td><td>${esc(s.processing)}</td><td><a href="/form?state=${s.code}" style="color:var(--pine)">File here</a></td></tr>`).join("")}
    </tbody></table></div></main>`+footer();
}

let payNote = "";
function statusLabel(s) { return s === "awaiting_payment" ? "awaiting payment" : s; }
function deskPage() {
  const mine = orders;
  return header(false)+`<main class="wrap pad">
    <p class="kicker">Customer desk</p><h1 style="font-size:2rem">Command</h1>
    <p class="small mist">Your orders and documents. ${draft.command?"":"Add the optional Command desk (vault, simple books, invoices) for $10/month."}</p>${payNote?`<p class="small" style="color:var(--pine)">${esc(payNote)}</p>`:""}${deskNote?`<p class="warn small">${esc(deskNote)}</p>`:""}
    <div class="grid g3" style="margin-top:1.4rem">
      <div class="card"><p class="kicker">Orders</p><p style="font-family:Fraunces,serif;font-size:2rem">${mine.length}</p></div>
      <div class="card"><p class="kicker">Quoted, unpaid</p><p style="font-family:Fraunces,serif;font-size:2rem">${money(mine.filter(o=>o.status!=="paid").reduce((a,o)=>a+o.due,0))}</p></div>
      <div class="card"><p class="kicker">Paid</p><p style="font-family:Fraunces,serif;font-size:2rem">${money(mine.reduce((a,o)=>a+(o.paidAmount||0),0))}</p></div>
    </div>
    <div style="margin-top:1.4rem">${mine.length?mine.map(o=>`<div class="card" style="margin-bottom:.7rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap">
      <div><strong>${esc(o.llcName)}</strong><p class="tiny mist">${esc(o.stateName)} · ${esc(o.document)} · quoted ${money(o.due)}${o.paidAmount?` · paid ${money(o.paidAmount)}`:""}</p></div>
      <div><span class="badge ${esc(o.status)}">${esc(statusLabel(o.status))}</span>
        ${o.status!=="paid"?`<button class="btn" data-pay="${esc(o.id)}" style="height:2.2rem;margin-left:.5rem">Pay</button>`:""}
        ${o.status!=="paid"?`<p class="tiny" style="margin-top:.4rem"><strong>Please pay the exact amount shown for your filing and add-ons.</strong></p>`:""}
      </div></div>`).join(""):`<div class="card mist">No formations yet. <a href="/form" style="color:var(--pine)">Open the wizard</a>.</div>`}</div>
  </main>`+footer();
}

function admin() {
  if (!isOperator) {
    return header(false)+`<main class="wrap pad" style="max-width:32rem">
      <p class="kicker">Admin desk</p><h1 style="font-size:2rem">Operator key required</h1>
      <p class="small mist">This area is for staff.</p>${deskNote?`<p class="warn small">${esc(deskNote)}</p>`:""}
      <a class="btn" href="/login?staff=1" style="margin-top:1rem">Staff sign in</a>
    </main>`+footer();
  }
  const open = queue.filter(q=>q.status!=="filed" && q.status!=="cancelled").length;
  const filed = queue.filter(q=>q.status==="filed").length;
  const rev = orders.reduce((a,o)=>a+(o.paidAmount||0),0);
  return header(false)+`<main class="wrap pad">
    <p class="kicker">Admin desk</p><h1 style="font-size:2rem">What needs a human</h1>
    <p class="small mist">Filings, EIN packets, website builds. Status changes here are what the customer sees.</p>${deskNote?`<p class="warn small">${esc(deskNote)}</p>`:""}
    <div class="grid g4" style="margin-top:1.2rem">
      <div class="card"><p class="kicker">Open work</p><p style="font-family:Fraunces,serif;font-size:2rem">${open}</p></div>
      <div class="card"><p class="kicker">Filed</p><p style="font-family:Fraunces,serif;font-size:2rem">${filed}</p></div>
      <div class="card"><p class="kicker">Paid amounts recorded</p><p style="font-family:Fraunces,serif;font-size:2rem">${money(rev)}</p></div>
      <div class="card"><p class="kicker">Orders</p><p style="font-family:Fraunces,serif;font-size:2rem">${orders.length}</p></div>
    </div>
    <div class="card" style="margin-top:1.2rem"><h3>Payments</h3>
      <p class="small mist">Submitting an order saves it, emails it to the desk inbox, and sends the customer to the Stripe payment link, Orders show the quoted total and stay "awaiting payment" until you record the paid amount and mark them paid here.</p>
    </div>
    <h3 style="margin-top:1.6rem">Orders</h3>
    ${orders.length?orders.map(o=>`<div class="card" style="margin-top:.6rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap">
      <div><strong>${esc(o.llcName)}</strong><p class="tiny mist">${esc(o.contactName||"no name")} · ${esc(o.email||"no email")} · ${esc(o.stateName)} · quoted ${money(o.due)} · paid amount ${o.paidAmount!=null?money(o.paidAmount):"not set"} · ${esc(statusLabel(o.status))} · order ${esc(o.id)}</p>${o.emailStatus?`<p class="tiny mist">order email: ${esc(o.emailStatus.status)}${o.emailError?` — ${esc(o.emailError)}`:""}</p>`:""}</div>
      <div><input id="pa-${esc(o.id)}" type="number" min="0" step="0.01" placeholder="paid amount $" value="${o.paidAmount!=null?(o.paidAmount/100).toFixed(2):""}" style="width:8rem;height:2.2rem"/>
        <button class="btn ghost" data-saveamt="${esc(o.id)}" style="height:2.2rem">Save amount</button>
        ${o.status!=="paid"?`<button class="btn" data-markpaid="${esc(o.id)}" style="height:2.2rem">Mark paid</button>`:""}</div></div>`).join(""):`<p class="mist">No orders yet.</p>`}
    <h3 style="margin-top:1.6rem">Queue</h3>
    ${queue.length?queue.map(q=>`<div class="card" style="margin-top:.6rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap">
      <div><strong>${esc(q.llcName)}</strong><p class="tiny mist">${esc(q.kind)} · ${esc(q.stateName)} · ${esc(q.status)}</p></div>
      <div>
        <select data-q="${esc(q.id)}">${["received","in_progress","filed","cancelled"].map(s=>`<option ${s===q.status?"selected":""}>${s}</option>`).join("")}</select>
      </div></div>`).join(""):`<p class="mist">Queue is empty. Place an order from the wizard.</p>`}
  </main>`+footer();
}

function login() {
  return header(false)+`<main class="wrap pad" style="max-width:28rem">
    <p class="kicker">Sign in</p><h1 style="font-size:2rem">The desk is on the server</h1>
    <p class="small mist">Your name stays in this browser. The order itself is written to the formation desk.</p>
    <label class="field"><span>Name</span><input id="nm" value="${esc(session.name)}" placeholder="Your name"/></label>
    ${route().q.staff || session.role==="admin" ? `<label class="small" style="display:flex;gap:.5rem;margin-top:1rem"><input type="checkbox" id="as-admin" ${session.role==="admin"?"checked":""}/> Staff desk</label>
    <label class="field" style="margin-top:.8rem"><span>Staff key</span><input id="op-key" type="password" value="${esc(session.operatorKey||"")}" placeholder="Staff key"/></label>` : ""}
    <button class="btn" data-act="signin" style="margin-top:1rem">Continue</button>
  </main>`+footer();
}

function harvest() {
  const g = id => document.getElementById(id);
  if (g("llcName")) draft.llcName = g("llcName").value;
  if (g("name-ack")) draft.nameAck = g("name-ack").checked ? draft.llcName.trim() : "";
  if (g("p-street")) draft.principal = {...draft.principal, street:g("p-street").value, city:g("p-city").value, zip:g("p-zip").value, state:draft.stateCode};
  if (g("mail-same")) draft.mailingSame = g("mail-same").checked;
  if (g("m-street")) draft.mailing = {...draft.mailing, street:g("m-street").value, city:g("m-city").value, zip:g("m-zip").value, state:draft.stateCode};
  if (g("ra-name")) draft.ra = {name:g("ra-name").value, street:g("ra-street").value, city:g("ra-city").value, zip:g("ra-zip").value, state:draft.stateCode};
  document.querySelectorAll("[data-mem]").forEach(el => {
    const i = +el.dataset.mem, k = el.dataset.k;
    if (!draft.members[i]) return;
    draft.members[i][k] = k==="ownership" ? Number(el.value||0) : el.value;
  });
  if (g("organizer")) draft.organizer = g("organizer").value;
  if (g("contactName")) draft.contactName = g("contactName").value.trim();
  if (g("email")) draft.email = g("email").value.trim();
  if (g("purpose")) draft.purpose = g("purpose").value;
  if (g("mgmt")) draft.management = g("mgmt").value;
  if (g("ein")) draft.ein = g("ein").checked;
  if (g("exp")) draft.expedited = g("exp").checked;
  if (g("rem")) draft.reminders = g("rem").checked;
  if (g("cmd")) draft.command = g("cmd").checked;
  if (g("web")) draft.website = g("web").checked;
  if (g("oa")) draft.oaPages = Math.max(3, Number(g("oa").value||3));
  persist();
}

// Pay: the order is saved on the server, the order email is sent, then we go straight to the Stripe
// payment link (the server returns the URL with client_reference_id and prefilled_email). The payer types
// the amount on Stripe. The page never sets "paid"; only the operator can (OPERATOR_KEY).
function goToPayment(data) {
  if (!data || typeof data.payUrl !== "string" || !data.payUrl.startsWith("https://buy.stripe.com/")) throw new Error("the desk did not return a Stripe payment link");
  location.assign(data.payUrl);
}

async function placeOrder() {
  harvest();
  const err = document.getElementById("order-err");
  const nIssue = nameIssue(draft.llcName, draft.stateCode);
  if (nIssue) { if (err) err.textContent = nIssue; return; }
  if (needsAck(draft.llcName, draft.stateCode)) { if (err) err.textContent = "Go back to the Name step and confirm the note about restricted words."; return; }
  if ((draft.contactName || "").trim().length < 2) { if (err) err.textContent = "Add your name."; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(draft.email || "")) { if (err) err.textContent = "Add a valid email."; return; }
  const st = BY[draft.stateCode];
  const q = quote(draft);
  const id = uid();
  const order = {
    id, llcName: draft.llcName.trim(), stateCode: draft.stateCode, stateName: st.name,
    document: st.document, agency: st.agency, due: q.due, contactName: draft.contactName.trim(), email: draft.email,
    created: new Date().toISOString(), organizer: draft.organizer || session.name || "",
    draft: JSON.parse(JSON.stringify(draft))
  };
  const items = [{id, llcName: order.llcName, kind: "filing", stateName: st.name, status: "received"}];
  if (draft.ein) items.push({id: id+"-ein", llcName: order.llcName, kind: "ein", stateName: st.name, status: "received"});
  let data;
  try {
    if (err) err.textContent = "Saving your order…";
    data = await desk("place", { order, items });
    applyDesk(data);
  } catch (e) {
    deskOk = false;
    deskNote = e.message;
    if (err) err.textContent = "The desk could not save this order (" + e.message + "). Nothing was recorded. Please try again.";
    return;
  }
  try {
    if (err) err.textContent = "Order saved. Opening the Stripe payment page…";
    goToPayment(data);
  } catch (e) {
    // The order is saved; show it on the desk, which has a Pay button.
    payNote = "Your order is saved, but the payment page could not open: " + e.message;
    go("/app?placed="+(data.orderId||""));
  }
}

function bind() {
  const app = document.getElementById("app");
  app.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "filing-state") { applyState(t.value); return; }
    if (t.id === "mail-same") { harvest(); render(); return; }
    if (t.dataset.q) {
      const item = queue.find(x => x.id === t.dataset.q);
      if (item) {
        desk("status", { queueId: item.id, status: t.value }).then(data => { applyDesk(data); render(); }).catch(e => { deskOk = false; deskNote = e.message; render(); });
      }
      return;
    }
    harvest();
    if (["ein","exp","rem","cmd","web","oa"].includes(t.id) || t.dataset.k === "ownership") render();
  });
  app.addEventListener("input", (e) => {
    if (e.target.id === "filing-state") return;
    harvest();
    if (e.target.id === "llcName") { const m = document.getElementById("llcName-err"); if (m) m.textContent = nameIssue(draft.llcName, draft.stateCode); const w = document.getElementById("llcName-warn"); if (w) w.innerHTML = approvalHtml(draft.llcName, draft.stateCode); }
  });
  app.addEventListener("click", (e) => {
    const b = e.target.closest("button, [data-state], [data-pay], [data-markpaid], [data-saveamt]");
    if (!b) return;
    if (b.dataset.state) { applyState(b.dataset.state); return; }
    if (b.dataset.go !== undefined) {
      const i = +b.dataset.go;
      harvest();
      if (i <= draft.step) draft.step = i;
      persist(); render(); return;
    }
    if (b.dataset.pay) {
      // Customers cannot mark an order paid. Pay re-sends the order to the desk and opens the Stripe link.
      payNote = "Opening the Stripe payment page…";
      render();
      desk("begin_payment", { orderId: b.dataset.pay }).then(data => { applyDesk(data); goToPayment(data); }).catch(e => { payNote = ""; deskNote = e.message; render(); });
      return;
    }
    if (b.dataset.saveamt) {
      const v = (document.getElementById("pa-" + b.dataset.saveamt) || {}).value;
      desk("paid_amount", { orderId: b.dataset.saveamt, paidAmount: v }).then(data => { applyDesk(data); render(); }).catch(e => { deskNote = e.message; render(); });
      return;
    }
    if (b.dataset.markpaid) {
      const v = (document.getElementById("pa-" + b.dataset.markpaid) || {}).value;
      desk("pay", { orderId: b.dataset.markpaid, paidAmount: v }).then(data => { applyDesk(data); render(); }).catch(e => { deskOk = false; deskNote = e.message; render(); });
      return;
    }
    const act = b.dataset.act;
    if (act === "back-state") { draft.step = 0; persist(); render(); }
    if (act === "back") { harvest(); draft.step = Math.max(0, draft.step-1); persist(); render(); }
    if (act === "next") { harvest(); if (!canNext()) { const m = document.getElementById("llcName-err"); if (m && draft.step===1) m.textContent = nameIssue(draft.llcName, draft.stateCode) || (needsAck(draft.llcName, draft.stateCode) ? "Tick the box under the name to confirm you've read the note about restricted words." : ""); return; } draft.step = Math.min(7, draft.step+1); persist(); render(); }
    if (act === "add-mem") { harvest(); draft.members.push({name:"", title:"Member", street:"", city:"", state:draft.stateCode, zip:"", ownership:0}); persist(); render(); }
    if (act === "del-mem") { harvest(); draft.members.splice(+b.dataset.i,1); persist(); render(); }
    if (act === "copy-office") {
      draft.ra = {name: draft.members[0]?.name || draft.organizer, street: draft.principal.street, city: draft.principal.city, state: draft.stateCode, zip: draft.principal.zip};
      persist(); render();
    }
    if (act === "place") placeOrder();
    if (act === "signin") {
      session.name = document.getElementById("nm").value.trim() || "Guest";
      const asAdmin = document.getElementById("as-admin");
      session.role = asAdmin && asAdmin.checked ? "admin" : "customer";
      const keyEl = document.getElementById("op-key");
      if (keyEl) session.operatorKey = keyEl.value;
      persist();
      const dest = session.role==="admin"?"/admin":"/app";
      desk(bootstrapAction()).then(data => { applyDesk(data); go(dest); }).catch(e => { deskOk = false; deskNote = e.message; go(dest); });
    }
  });
}

function render() {
  const {path} = route();
  const root = document.getElementById("app");
  let html = "";
  if (path === "/" || path === "") html = home();
  else if (path.startsWith("/form")) html = wizard();
  else if (path.startsWith("/llc-fees")) html = fees();
  else if (path.startsWith("/learn")) html = learn();
  else if (path.startsWith("/app")) html = deskPage();
  else if (path.startsWith("/admin")) html = admin();
  else if (path.startsWith("/login")) html = login();
  else html = home();
  setMeta(path);
  root.innerHTML = html;
}

window.addEventListener("popstate", render);
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href^='/']");
  if (!a || a.target || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  const u = new URL(a.href);
  if (!/^\/(form|llc-fees|fees|learn|app|admin|login)?$/.test(u.pathname.replace(/\/+$/, "") || "/") && u.pathname !== "/") return;
  e.preventDefault(); go(u.pathname + u.search);
});
bind();
// Google Analytics (GA4). Nothing is loaded, requested or fired until the visitor clicks Accept.
// The choice is stored in localStorage under pf_cookie_consent ("accepted" | "declined").
const GA_MEASUREMENT_ID = "G-CN3010VLKJ";
const CONSENT_KEY = "pf_cookie_consent";
function getConsent() { try { return localStorage.getItem(CONSENT_KEY); } catch { return null; } }
function setConsent(v) { try { localStorage.setItem(CONSENT_KEY, v); } catch { /* ignore */ } }
function loadAnalytics() {
  if (getConsent() !== "accepted") return;
  if (document.querySelector("script[data-pf-analytics]")) return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function gtag() { window.dataLayer.push(arguments); };
  const s = document.createElement("script");
  s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_MEASUREMENT_ID; s.setAttribute("data-pf-analytics", "1");
  document.head.appendChild(s);
  window.gtag("js", new Date());
  window.gtag("config", GA_MEASUREMENT_ID);
}
function hideConsentBanner() { const el = document.getElementById("pf-consent"); if (el) el.hidden = true; }
window.pfConsent = {
  grant() { setConsent("accepted"); hideConsentBanner(); loadAnalytics(); },
  decline() { setConsent("declined"); hideConsentBanner(); }
};
(function initConsent() {
  const el = document.getElementById("pf-consent");
  if (!el) return;
  document.getElementById("pf-consent-accept").addEventListener("click", () => window.pfConsent.grant());
  document.getElementById("pf-consent-decline").addEventListener("click", () => window.pfConsent.decline());
  if (getConsent() === null) el.hidden = false;
})();
loadAnalytics();
render();
desk(bootstrapAction()).then(data => { applyDesk(data); render(); }).catch(e => { deskOk = false; deskNote = e.message; render(); });
</script>
