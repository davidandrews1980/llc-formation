<style>
:root{

*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.55;min-height:100%}

a{color:inherit}button,select,input,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-family:Fraunces,serif;font-size:1.15rem}

.nav{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.nav a,.ghost, .btn, .chip{display:inline-flex;align-items:center;justify-content:center;border:0;text-decoration:none}
.nav a{padding:.4rem .7rem;color:var(--mist);font-size:.875rem}
.nav a:hover,.nav a.on{color:var(--ink)}
.btn{height:2.75rem;padding:0 1.15rem;border-radius:.5rem;background:var(--ink);color:var(--paper);font-weight:500}
.btn:hover{background:#000}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.paper{background:var(--paper);color:var(--ink)}

.hero{background:var(--ink);color:var(--paper);padding:4rem 0}
.hero p.k{letter-spacing:.18em;text-transform:uppercase;font-size:.7rem;color:rgba(251,248,241,.55);margin:0}

.row{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.8rem}

.ink-card{background:var(--ink-soft);border-radius:.9rem;padding:1.4rem;color:var(--paper)}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kicker{letter-spacing:.18em;text-transform:uppercase;font-size:.7rem;color:var(--mist);margin:0}
.mist{color:var(--mist)}.small{font-size:.875rem}.tiny{font-size:.75rem}
section.pad{padding:3.5rem 0}
.price{font-variant-numeric:tabular-nums}
.steps{display:flex;flex-wrap:wrap;gap:.4rem;margin:1.4rem 0 0}
.steps button{border:0;border-radius:999px;padding:.3rem .7rem;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;background:var(--paper-2);color:var(--mist)}
.steps button.on{background:var(--ink);color:var(--paper)}.steps button.done{background:rgba(44,74,62,.15);color:var(--pine)}
.field{display:flex;flex-direction:column;gap:.35rem;font-size:.875rem}
.field span{color:var(--mist);font-size:.75rem;letter-spacing:.04em;text-transform:uppercase}
input,select,textarea{height:2.7rem;border:0;border-radius:.45rem;background:var(--paper);box-shadow:var(--shadow);padding:0 .75rem;color:var(--ink)}
textarea{height:auto;min-height:6rem;padding:.75rem;resize:vertical}
.banner{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:.5rem;padding:.85rem 1rem;margin-bottom:1.4rem}
.filing{background:var(--ink);color:var(--paper);border-radius:.6rem;padding:1.2rem 1.15rem;margin-top:1.4rem}
.filing h3{font-size:2rem}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1.1rem;font-size:.875rem}
.dl div span{display:block;color:rgba(251,248,241,.5);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.quick{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.chip{height:2.6rem;padding:0 .85rem;border-radius:.5rem;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);font-size:.875rem}
.chip.on{background:var(--ink);color:var(--paper)}
.lock{height:2.7rem;border-radius:.45rem;background:var(--paper-2);display:flex;align-items:center;justify-content:space-between;padding:0 .75rem;font-size:.875rem}
.foot{border-top:1px solid var(--line);background:var(--cream);padding:2.5rem 0;margin-top:3rem;font-size:.875rem;color:var(--mist)}
.sticky{position:sticky;bottom:0;background:rgba(243,239,230,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:.8rem 0;margin-top:1.5rem}
.warn{color:var(--danger)}
.ok{color:var(--pine)}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th,td{text-align:left;padding:.65rem .4rem;border-bottom:1px solid var(--line)}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);font-weight:500}
.badge{display:inline-block;border-radius:999px;padding:.15rem .55rem;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;background:var(--paper-2)}
.badge.due{background:#f3e2c7;color:#8a5a1a}.badge.paid{background:#dce8e1;color:var(--pine)}.badge.filed{background:var(--ink);color:var(--paper)}
@media(max-width:720px){.dl{grid-template-columns:1fr}.hero{padding:2.5rem 0}h1{font-size:2rem!important}
</style>
</head>

  const fee = stateFee(s.stateCode, members);

  const expSv = s.expedited ? P.expSvc : 0;
  const ein = s.ein ? P.ein : 0;
  const oa = Math.max(0, s.oaPages - P.oaFree) * P.oaPage;
  const rem = s.reminders ? P.reminders : 0;
  const cmd = s.command ? P.command : 0;
  const web = s.website ? P.website : 0;
  const due = fee + expSt + expSv + ein + oa + rem + cmd + web;
  return {st, fee, expSt, expSv, ein, oa, rem, cmd, web, due};
}
function canNext() {
  if (draft.step===1) return draft.llcName.trim().length>=3;
  if (draft.step===2) return !!(draft.principal.street && draft.principal.city && draft.principal.zip);
  if (draft.step===3) return !!(draft.ra.name && draft.ra.street && draft.ra.city && draft.ra.zip);
  if (draft.step===4) return draft.members.every(m=>m.name.trim()) && !!draft.organizer.trim();

}

function route() {
  const h = (location.hash || "#/").replace(/^#/, "") || "/";
  const [path, qs] = h.split("?");
  const q = Object.fromEntries(new URLSearchParams(qs || ""));
  return {path: path || "/", q};
}
function go(path) { location.hash = path; }

function applyState(code) {
  if (!BY[code]) return;
  const prev = draft.stateCode;
  draft.stateCode = code;
  draft.principal.state = code;
  draft.mailing.state = code;
  draft.ra.state = code;
  draft.members = draft.members.map(m => ({...m, state: (!m.state || m.state === prev) ? code : m.state}));
  persist();
  const r = route();
  if (r.path === "/form") {
    const qs = new URLSearchParams(r.q);
    qs.set("state", code);
    location.hash = "/form?" + qs.toString();
  }
  render();
}

    </ul>
    <p class="small mist">An LLC that exists only as a PDF on a laptop will not help you. Keep the books. Keep the calendar.</p>
    <a class="btn" href="#/form" style="margin-top:1rem">Start the wizard</a>
  </main>`+footer();
}

function desk() {
  const mine = orders;
  return header(false)+`<main class="wrap pad">
    <p class="kicker">Customer desk</p><h1 style="font-size:2rem">Command</h1>
    <p class="small mist">Documents, reminders, and the partners we can actually send you to. $10 a month covers this desk.</p>
    <div class="grid g3" style="margin-top:1.4rem">
      <div class="card"><p class="kicker">Orders</p><p style="font-family:Fraunces,serif;font-size:2rem">${mine.length}</p></div>
      <div class="card"><p class="kicker">Due</p><p style="font-family:Fraunces,serif;font-size:2rem">${money(mine.filter(o=>o.status!=="paid").reduce((a,o)=>a+o.due,0))}</p></div>
      <div class="card"><p class="kicker">Paid</p><p style="font-family:Fraunces,serif;font-size:2rem">${money(mine.filter(o=>o.status==="paid").reduce((a,o)=>a+o.due,0))}</p></div>
    </div>
    <div style="margin-top:1.4rem">${mine.length?mine.map(o=>`<div class="card" style="margin-bottom:.7rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap">
      <div><strong>${esc(o.llcName)}</strong><p class="tiny mist">${esc(o.stateName)} · ${esc(o.document)} · ${money(o.due)}</p></div>
      <div><span class="badge ${o.status}">${o.status}</span>
        ${o.status!=="paid"?`<button class="btn" data-pay="${o.id}" style="height:2.2rem;margin-left:.5rem">Mark paid (demo)</button>`:""}
      </div></div>`).join(""):`<div class="card mist">No formations yet. <a href="#/form" style="color:var(--pine)">Open the wizard</a>.</div>`}</div>
  </main>`+footer();
}

function admin() {
  const open = queue.filter(q=>q.status!=="filed" && q.status!=="cancelled").length;
  const filed = queue.filter(q=>q.status==="filed").length;
  const rev = orders.filter(o=>o.status==="paid").reduce((a,o)=>a+o.due,0);
  return header(false)+`<main class="wrap pad">
    <p class="kicker">Admin desk</p><h1 style="font-size:2rem">What needs a human</h1>
    <p class="small mist">Filings, EIN packets, website builds. Status changes here are what the customer sees.</p>
    <div class="grid g4" style="margin-top:1.2rem">
      <div class="card"><p class="kicker">Open work</p><p style="font-family:Fraunces,serif;font-size:2rem">${open}</p></div>
      <div class="card"><p class="kicker">Filed</p><p style="font-family:Fraunces,serif;font-size:2rem">${filed}</p></div>
      <div class="card"><p class="kicker">Collected</p><p style="font-family:Fraunces,serif;font-size:2rem">${money(rev)}</p></div>
      <div class="card"><p class="kicker">Orders</p><p style="font-family:Fraunces,serif;font-size:2rem">${orders.length}</p></div>
    </div>
    <div class="card" style="margin-top:1.2rem"><h3>Stripe</h3>
      <p class="small mist">Checkout is built on the full server app. This live page records the order so the desks work tonight. To charge cards you still paste the Stripe secret key and webhook signing secret on the host that runs the server.</p>
    </div>
    <h3 style="margin-top:1.6rem">Queue</h3>
    ${queue.length?queue.map(q=>`<div class="card" style="margin-top:.6rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap">
      <div><strong>${esc(q.llcName)}</strong><p class="tiny mist">${esc(q.kind)} · ${esc(q.stateName)} · ${q.status}</p></div>
      <div>
        <select data-q="${q.id}">${["received","in_progress","filed","cancelled"].map(s=>`<option ${s===q.status?"selected":""}>${s}</option>`).join("")}</select>
      </div></div>`).join(""):`<p class="mist">Queue is empty. Place an order from the wizard.</p>`}
  </main>`+footer();
}

function login() {
  return header(false)+`<main class="wrap pad" style="max-width:28rem">
    <p class="kicker">Sign in</p><h1 style="font-size:2rem">The desk is local tonight</h1>
    <p class="small mist">This live GitHub page stores your name in this browser. The full server uses real accounts.</p>
    <label class="field"><span>Name</span><input id="nm" value="${esc(session.name)}" placeholder="David"/></label>
    <label class="small" style="display:flex;gap:.5rem;margin-top:1rem"><input type="checkbox" id="as-admin"/> Admin desk access</label>
    <button class="btn" data-act="signin" style="margin-top:1rem">Continue</button>
  </main>`+footer();
}

function harvest() {
  const g = id => document.getElementById(id);
  if (g("llcName")) draft.llcName = g("llcName").value;
  if (g("p-street")) draft.principal = {...draft.principal, street:g("p-street").value, city:g("p-city").value, zip:g("p-zip").value, state:draft.stateCode};
  if (g("mail-same")) draft.mailingSame = g("mail-same").checked;
  if (g("m-street")) draft.mailing = {...draft.mailing, street:g("m-street").value, city:g("m-city").value, zip:g("m-zip").value, state:draft.stateCode};
  if (g("ra-name")) draft.ra = {name:g("ra-name").value, street:g("ra-street").value, city:g("ra-city").value, zip:g("ra-zip").value, state:draft.stateCode};
  document.querySelectorAll("[data-mem]").forEach(el => {
    const i = +el.dataset.mem, k = el.dataset.k;
    if (!draft.members[i]) return;
    draft.members[i][k] = k==="ownership" ? Number(el.value||0) : el.value;
  });
  if (g("organizer")) draft.organizer = g("organizer").value;
  if (g("purpose")) draft.purpose = g("purpose").value;
  if (g("mgmt")) draft.management = g("mgmt").value;
  if (g("ein")) draft.ein = g("ein").checked;
  if (g("exp")) draft.expedited = g("exp").checked;
  if (g("rem")) draft.reminders = g("rem").checked;
  if (g("cmd")) draft.command = g("cmd").checked;
  if (g("web")) draft.website = g("web").checked;
  if (g("oa")) draft.oaPages = Math.max(3, Number(g("oa").value||3));
  persist();
}

function placeOrder() {
  harvest();
  if (draft.llcName.trim().length < 3) { const e=document.getElementById("order-err"); if(e) e.textContent="Name the company first."; return; }
  const st = BY[draft.stateCode];
  const q = quote(draft);
  const id = uid();
  const order = {
    id, llcName: draft.llcName.trim(), stateCode: draft.stateCode, stateName: st.name,
    document: st.document, agency: st.agency, due: q.due, status: "due",
    created: new Date().toISOString(), draft: JSON.parse(JSON.stringify(draft))
  };
  orders.unshift(order);
  queue.unshift({id, llcName: order.llcName, kind: "filing", stateName: st.name, status: "received"});
  if (draft.ein) queue.unshift({id: id+"-ein", llcName: order.llcName, kind: "ein", stateName: st.name, status: "received"});
  persist();
  go("/app?placed="+id);
}

function bind() {
  const app = document.getElementById("app");
  app.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "filing-state") { applyState(t.value); return; }
    if (t.id === "mail-same") { harvest(); render(); return; }
    if (t.dataset.q) {
      const item = queue.find(x => x.id === t.dataset.q);
      if (item) { item.status = t.value; persist(); render(); }
      return;
    }
    harvest();
    if (["ein","exp","rem","cmd","web","oa"].includes(t.id)) render();
  });
  app.addEventListener("input", (e) => {
    if (e.target.id === "filing-state") return;
    harvest();
  });
  app.addEventListener("click", (e) => {
    const b = e.target.closest("button, [data-state], [data-pay]");
    if (!b) return;
    if (b.dataset.state) { applyState(b.dataset.state); return; }
    if (b.dataset.go !== undefined) {
      const i = +b.dataset.go;
      harvest();
      if (i <= draft.step) draft.step = i;
      persist(); render(); return;
    }
    if (b.dataset.pay) {
      const o = orders.find(x => x.id === b.dataset.pay);
      if (o) { o.status = "paid"; persist(); render(); }
      return;
    }
    const act = b.dataset.act;
    if (act === "back-state") { draft.step = 0; persist(); render(); }
    if (act === "back") { harvest(); draft.step = Math.max(0, draft.step-1); persist(); render(); }
    if (act === "next") { harvest(); if (!canNext()) return; draft.step = Math.min(7, draft.step+1); persist(); render(); }
    if (act === "add-mem") { harvest(); draft.members.push({name:"", title:"Member", street:"", city:"", state:draft.stateCode, zip:"", ownership:0}); persist(); render(); }
    if (act === "del-mem") { harvest(); draft.members.splice(+b.dataset.i,1); persist(); render(); }
    if (act === "copy-office") {
      draft.ra = {name: draft.members[0]?.name || draft.organizer, street: draft.principal.street, city: draft.principal.city, state: draft.stateCode, zip: draft.principal.zip};
      persist(); render();
    }
    if (act === "place") placeOrder();
    if (act === "signin") {
      session.name = document.getElementById("nm").value.trim() || "Guest";
      session.role = document.getElementById("as-admin").checked ? "admin" : "customer";
      persist(); go(session.role==="admin"?"/admin":"/app");
    }
  });
}

function render() {
  const {path} = route();
  const root = document.getElementById("app");
  let html = "";
  if (path === "/" || path === "") html = home();
  else if (path.startsWith("/form")) html = wizard();
  else if (path.startsWith("/fees")) html = fees();
  else if (path.startsWith("/learn")) html = learn();
  else if (path.startsWith("/app")) html = desk();
  else if (path.startsWith("/admin")) html = admin();
  else if (path.startsWith("/login")) html = login();
  else html = home();
  root.innerHTML = html;
}

window.addEventListener("hashchange", render);
bind();
render();
</script>
</body>
</html>
